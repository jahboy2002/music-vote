<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร่วมโหวตกิจกรรม!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            /* พื้นหลังไล่สีสดใสสไตล์วัยรุ่น */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .btn-choice {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-choice:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .btn-choice:active {
            transform: translateY(0) scale(0.98);
        }

        /* อนิเมชันโหลดข้อมูล */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #764ba2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .fade-in { animation: fadeIn 0.5s ease-in forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- การ์ดหลัก -->
    <div class="glass-card w-full max-w-md p-8 relative overflow-hidden text-center">
        
        <!-- ของตกแต่งการ์ด -->
        <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-300 rounded-full mix-blend-multiply filter blur-2xl opacity-50 -mr-10 -mt-10"></div>
        <div class="absolute bottom-0 left-0 w-32 h-32 bg-pink-300 rounded-full mix-blend-multiply filter blur-2xl opacity-50 -ml-10 -mb-10"></div>

        <!-- หน้าจอที่ 1: กำลังโหลด -->
        <div id="loadingScreen" class="py-12 z-10 relative">
            <div class="loader mb-4"></div>
            <p class="text-gray-600 font-semibold text-lg animate-pulse">กำลังดึงข้อมูลกิจกรรม... 🎶</p>
        </div>

        <!-- หน้าจอที่ 2: แสดงหัวข้อและปุ่มโหวต -->
        <div id="votingScreen" class="hidden z-10 relative fade-in">
            <div class="mb-8">
                <span class="inline-block py-1 px-3 rounded-full bg-indigo-100 text-indigo-800 text-sm font-bold mb-4">✨ Live Voting ✨</span>
                <h1 id="displayTopic" class="text-2xl md:text-3xl font-extrabold text-gray-800 leading-tight">
                    <!-- หัวข้อจะมาแสดงที่นี่ -->
                </h1>
            </div>
            
            <div id="choicesList" class="flex flex-col space-y-4">
                <!-- ปุ่มตัวเลือกจะถูกสร้างขึ้นมาที่นี่ -->
            </div>
        </div>

        <!-- หน้าจอที่ 3: โหวตสำเร็จ -->
        <div id="successScreen" class="hidden py-8 z-10 relative fade-in">
            <div class="text-6xl mb-4">🎉</div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">ส่งคำตอบเรียบร้อย!</h2>
            <p class="text-gray-600 font-medium mb-6">ขอบคุณที่ร่วมสนุก รอดูผลโหวตบนหน้าจอหลักได้เลยครับ 🚀</p>
            <button id="voteAgainLink" onclick="location.reload()" class="text-sm text-indigo-500 font-bold hover:text-indigo-700 underline hidden">โหวตใหม่อีกครั้ง</button>
        </div>

        <!-- หน้าจอที่ 4: โหวตไปแล้ว (กันโหวตซ้ำ) -->
        <div id="alreadyVotedScreen" class="hidden py-8 z-10 relative fade-in">
            <div class="text-6xl mb-4">🙌</div>
            <h2 class="text-2xl font-bold text-yellow-600 mb-2">คุณได้ร่วมโหวตไปแล้ว!</h2>
            <p class="text-gray-600 font-medium mb-6">กิจกรรมนี้จำกัด 1 สิทธิ์ ต่อ 1 คน<br>ขอบคุณที่ร่วมสนุกครับ 🎵</p>
        </div>

    </div>

    <script>
        // ใช้ URL สมองกลเดิมที่เชื่อมไว้
        const API_URL = "https://script.google.com/macros/s/AKfycbwHfX4JhbhSNz7BFp8mjYR9hqSIUfYsk9fjcLnb0lGCAi92V5yNHbA_bCAplGla9yDULA/exec";

        let currentTopic = "";
        let allowMultiple = false;

        // สีสันสำหรับปุ่มให้ดูไม่น่าเบื่อ
        const colors = [
            'bg-gradient-to-r from-blue-400 to-blue-600',
            'bg-gradient-to-r from-green-400 to-green-600',
            'bg-gradient-to-r from-pink-400 to-pink-600',
            'bg-gradient-to-r from-yellow-400 to-orange-500',
            'bg-gradient-to-r from-purple-400 to-purple-600'
        ];

        // เมื่อเปิดหน้าเว็บมา ให้ดึงข้อมูลทันที
        window.onload = async () => {
            initApp();
        };

        async function initApp() {
            showScreen('loadingScreen');
            try {
                const response = await fetch(API_URL + "?action=getSettings");
                const data = await response.json();

                if (data.topic && data.choices.length > 0) {
                    currentTopic = data.topic;
                    allowMultiple = data.allowMultipleVotes === "true" || data.allowMultipleVotes === true;
                    
                    checkVoteStatus(data.choices);
                } else {
                    document.getElementById('loadingScreen').innerHTML = "🤷‍♂️<br><br>ยังไม่มีการตั้งหัวข้อโหวต<br>รอคุณครูสักครู่นะครับ!";
                }
            } catch (error) {
                document.getElementById('loadingScreen').innerHTML = "❌<br><br>เชื่อมต่อระบบไม่ได้<br>โปรดลองรีเฟรชหน้าเว็บใหม่";
            }
        }

        function checkVoteStatus(choices) {
            // เช็คว่ามือถือเครื่องนี้เคยปั๊มตรายางหัวข้อนี้หรือยัง
            const hasVoted = localStorage.getItem('voted_' + currentTopic);

            if (hasVoted === 'true' && !allowMultiple) {
                // ถ้าเคยโหวตแล้ว และครูปิดสวิตช์ห้ามโหวตซ้ำ
                showScreen('alreadyVotedScreen');
            } else {
                // ถ้ายังไม่เคยโหวต หรือครูเปิดสวิตช์อนุญาต
                renderChoices(choices);
                showScreen('votingScreen');
            }
        }

        function renderChoices(choices) {
            document.getElementById('displayTopic').innerText = currentTopic;
            const choicesContainer = document.getElementById('choicesList');
            choicesContainer.innerHTML = ''; 

            choices.forEach((choice, index) => {
                const colorClass = colors[index % colors.length];
                const btn = document.createElement('button');
                btn.className = `btn-choice w-full py-4 px-6 text-white text-lg font-bold rounded-2xl shadow-md flex items-center justify-between ${colorClass}`;
                btn.innerHTML = `
                    <span class="text-left w-full">${choice}</span>
                    <span class="bg-white/20 rounded-full w-8 h-8 flex items-center justify-center text-sm ml-2">👆</span>
                `;
                btn.onclick = () => submitVote(choice, btn);
                choicesContainer.appendChild(btn);
            });
        }

        // ฟังก์ชันส่งผลโหวต
        async function submitVote(choice, btnElement) {
            // ทำให้ปุ่มอื่นกดไม่ได้ระหว่างรอส่ง
            const allBtns = document.querySelectorAll('.btn-choice');
            allBtns.forEach(b => { b.disabled = true; b.style.opacity = '0.5'; });
            
            // เปลี่ยนข้อความปุ่มที่กดให้เป็นสถานะกำลังโหลด
            const originalHTML = btnElement.innerHTML;
            btnElement.style.opacity = '1';
            btnElement.innerHTML = `<span class="loader border-white/30 border-t-white w-6 h-6 border-2 mx-auto"></span>`;

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        'action': 'submitVote',
                        'choice': choice
                    })
                });

                // ประทับตรายางลงในมือถือเครื่องนี้
                localStorage.setItem('voted_' + currentTopic, 'true');

                // จัดการปุ่ม "โหวตอีกครั้ง" (ซ่อน/แสดง ตามสวิตช์ที่ครูตั้ง)
                if (allowMultiple) {
                    document.getElementById('voteAgainLink').classList.remove('hidden');
                } else {
                    document.getElementById('voteAgainLink').classList.add('hidden');
                }

                // ส่งสำเร็จ เปลี่ยนหน้าจอ
                showScreen('successScreen');

            } catch (error) {
                alert("เกิดข้อผิดพลาดในการส่งข้อมูล โปรดลองอีกครั้ง");
                // คืนค่าปุ่ม
                allBtns.forEach(b => { b.disabled = false; b.style.opacity = '1'; });
                btnElement.innerHTML = originalHTML;
            }
        }

        // ฟังก์ชันตัวช่วยสลับหน้าจอ (เก็บกวาดให้สะอาดตา)
        function showScreen(screenId) {
            ['loadingScreen', 'votingScreen', 'successScreen', 'alreadyVotedScreen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }
    </script>
</body>
</html>
