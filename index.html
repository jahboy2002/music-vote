<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ร่วมโหวตกิจกรรม | THANYARAT SCHOOL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 50%, #0f172a 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        /* Animation สำหรับการโหลด */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin 2s linear infinite; }

        /* เอฟเฟกต์ปุ่มตัวเลือก */
        .btn-choice {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-choice:active { transform: scale(0.96); opacity: 0.9; }

        /* สำหรับ Pull-to-refresh */
        #pull-indicator {
            transition: transform 0.2s, opacity 0.2s;
            pointer-events: none;
        }
    </style>
</head>
<body class="safe-top p-5">

    <div id="pull-indicator" class="fixed top-0 left-0 w-full flex justify-center p-4 opacity-0 z-50">
        <div class="bg-white/20 backdrop-blur-md p-2 rounded-full border border-white/30">
            <span class="text-xl">🔄</span>
        </div>
    </div>

    <div class="w-full max-w-md mt-10 mb-20 glass-panel p-8 text-center relative">
        
        <div class="mb-8">
            <div class="flex justify-center items-center space-x-2 mb-4">
                <span class="inline-block bg-pink-500/20 text-pink-300 px-4 py-1 rounded-full text-xs font-bold tracking-wider border border-pink-500/30">
                    LIVE POLLING 🎵
                </span>
                <button onclick="initApp()" class="p-1 hover:bg-white/10 rounded-full transition active:rotate-180">
                    <span class="text-lg">🔄</span>
                </button>
            </div>
            <h1 id="topicTitle" class="text-2xl md:text-3xl font-extrabold leading-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-200 to-pink-200 px-2">
                กำลังดึงหัวข้อ...
            </h1>
        </div>

        <div id="mainContainer">
            <div id="loadingScreen" class="py-12">
                <div class="w-12 h-12 border-4 border-white/20 border-t-white rounded-full animate-spin mx-auto"></div>
                <p class="mt-4 text-white/60 text-sm italic">กำลังปรับจูนระบบ...</p>
            </div>

            <div id="votingScreen" class="hidden space-y-4"></div>

            <div id="successScreen" class="hidden py-8 animate-in fade-in">
                <div class="text-6xl mb-4">🎉</div>
                <h2 class="text-2xl font-bold text-green-400 mb-2">ส่งคำตอบแล้ว!</h2>
                <p class="text-white/70 text-sm mb-6">ขอบคุณที่ร่วมสนุก รอดูผลโหวต<br>บนจอโปรเจกเตอร์ได้เลยครับ</p>
                <button id="voteAgainBtn" onclick="initApp()" class="px-6 py-2 bg-white/10 hover:bg-white/20 border border-white/30 rounded-full text-sm font-semibold transition hidden">
                    โหวตอีกครั้ง 🔄
                </button>
            </div>

            <div id="alreadyVotedScreen" class="hidden py-8">
                <div class="text-6xl mb-4">🙌</div>
                <h2 class="text-xl font-bold text-yellow-400 mb-2">คุณโหวตไปแล้ว!</h2>
                <p class="text-white/60 text-sm">หัวข้อนี้จำกัด 1 สิทธิ์ ต่อ 1 เครื่อง<br>ขอบคุณมากครับนักเรียน</p>
            </div>
        </div>
    </div>

    <footer class="mt-auto py-6 text-center w-full">
        <p class="text-[10px] text-white/30 tracking-[0.2em] uppercase font-bold">
            © 2026 Matiphat Cherdsuk | THANYARAT SCHOOL
        </p>
    </footer>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwHfX4JhbhSNz7BFp8mjYR9hqSIUfYsk9fjcLnb0lGCAi92V5yNHbA_bCAplGla9yDULA/exec";
        
        let currentTopic = "";
        let allowMultiple = false;
        
        // --- ระบบ Pull to Refresh ---
        let touchStart = 0;
        document.addEventListener('touchstart', e => touchStart = e.touches[0].pageY);
        document.addEventListener('touchmove', e => {
            const touchMove = e.touches[0].pageY;
            const diff = touchMove - touchStart;
            if (window.scrollY === 0 && diff > 70) {
                document.getElementById('pull-indicator').style.opacity = '1';
                document.getElementById('pull-indicator').style.transform = `translateY(${Math.min(diff/2, 50)}px)`;
            }
        });
        document.addEventListener('touchend', e => {
            const touchEnd = e.changedTouches[0].pageY;
            if (window.scrollY === 0 && (touchEnd - touchStart) > 100) {
                initApp();
            }
            document.getElementById('pull-indicator').style.opacity = '0';
            document.getElementById('pull-indicator').style.transform = 'translateY(0)';
        });

        // --- ระบบหลัก ---
        async function initApp() {
            showScreen('loadingScreen');
            try {
                const response = await fetch(`${API_URL}?action=getSettings`);
                const data = await response.json();

                if (data.topic) {
                    currentTopic = data.topic;
                    allowMultiple = (data.allowMultipleVotes === "true" || data.allowMultipleVotes === true);
                    document.getElementById('topicTitle').innerText = currentTopic;
                    
                    const hasVoted = localStorage.getItem('voted_' + currentTopic);
                    if (hasVoted === 'true' && !allowMultiple) {
                        showScreen('alreadyVotedScreen');
                    } else {
                        renderChoices(data.choices);
                        showScreen('votingScreen');
                    }
                }
            } catch (error) {
                document.getElementById('topicTitle').innerText = "เชื่อมต่อล้มเหลว";
                console.error(error);
            }
        }

        function renderChoices(choices) {
            const container = document.getElementById('votingScreen');
            container.innerHTML = '';
            const colors = ['from-blue-500 to-blue-700', 'from-emerald-500 to-emerald-700', 'from-pink-500 to-pink-700', 'from-amber-500 to-orange-700', 'from-purple-500 to-indigo-700'];

            choices.forEach((choice, i) => {
                const btn = document.createElement('button');
                btn.className = `btn-choice w-full py-4 px-6 rounded-2xl text-lg font-bold text-white bg-gradient-to-r ${colors[i % colors.length]} shadow-xl flex justify-between items-center`;
                btn.innerHTML = `<span>${choice}</span><span class="opacity-50">👆</span>`;
                btn.onclick = () => submitVote(choice);
                container.appendChild(btn);
            });
        }

        async function submitVote(choice) {
            showScreen('loadingScreen');
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ 'action': 'vote', 'choice': choice })
                });
                const result = await res.json();
                if (result.status === 'success') {
                    localStorage.setItem('voted_' + currentTopic, 'true');
                    document.getElementById('voteAgainBtn').style.display = allowMultiple ? 'inline-block' : 'none';
                    showScreen('successScreen');
                }
            } catch (e) {
                alert("ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่");
                initApp();
            }
        }

        function showScreen(id) {
            ['loadingScreen', 'votingScreen', 'successScreen', 'alreadyVotedScreen'].forEach(s => {
                document.getElementById(s).classList.add('hidden');
            });
            document.getElementById(id).classList.remove('hidden');
        }

        window.onload = initApp;
    </script>
</body>
</html>
